bind=SUPER,Q,killclient
bind=SUPER,Tab,toggleoverview
bind=SUPER,Space,togglefloating
bind=SUPER,Y,toggleglobal,
bind=none,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && f="$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png" && grim -g "$g" "$f" && wl-copy -t image/png < "$f"

bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind=SUPER,T,spawn,alacritty

bind=SUPER,D,spawn,fuzzel
bind=SUPER,B,spawn,flatpak run app.zen_browser.zen
bind=SUPER,E,spawn,emacs
bind=SUPER,A,spawn,nautilus

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,J,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,I,focusdir,up
bind=SUPER,K,focusdir,down

bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

bind=SUPER+SHIFT,J,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,I,exchange_client,up
bind=SUPER+SHIFT,K,exchange_client,down

bind=SUPER+ALT,H,switch_proportion_preset
bind=SUPER+ALT,L,switch_proportion_preset

bind=SUPER,M,togglemaximizescreen
bind=SUPER+SHIFT,M,togglefullscreen

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

bind=SUPER+CTRL+SHIFT,I,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,K,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,J,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,L,movewin,+50,+0

bind=CTRL+SUPER,I,resizewin,+0,-10%
bind=CTRL+SUPER,K,resizewin,+0,+10%
bind=CTRL+SUPER,J,resizewin,-10%,+0
bind=CTRL+SUPER,L,resizewin,+10%,+0
